name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test + Build Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # A tag push does not trigger the Tests workflow (it filters on
      # branches), so the release gates on the fast portable trio itself.
      - name: Test gate
        timeout-minutes: 10
        run: |
          python -X faulthandler tests/tests.py
          python -X faulthandler tests/replay_tests.py
          python -X faulthandler tests/crash_tests.py

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --outdir dist/

      # the wheel must contain exactly one module: the tool
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          tops = {n.split('/')[0] for n in names if n.endswith('.py')}
          print(wheel, '->', sorted(names))
          assert tops == {'checkdisk.py'}, f'unexpected wheel contents: {tops}'
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checkdisk-release-packages
          path: dist/

  publish:
    name: Publish to PyPI and GitHub
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    # elevated permissions for the publish job
    permissions:
      contents: write      # Needed to create the GitHub Release
      id-token: write      # Needed for PyPI trusted publishing (OIDC)

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: checkdisk-release-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
